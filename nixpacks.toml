[variables]
COMPOSER_ALLOW_SUPERUSER = "1"

[phases.install]
cmds = [
    "[ -f .env ] || cp .env.example .env",
    "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
    "mkdir -p var/cache var/log var/sessions/prod",
    "php bin/console assets:install public --no-interaction || true",
    "php bin/console cache:warmup --env=prod --no-interaction || true"
]

[start]
cmd = "php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=prod || true; php bin/console app:seed-foundation --admin-email=\"${ADMIN_EMAIL:-mayendajabulani@gmail.com}\" --admin-password=\"${ADMIN_PASSWORD:-axxz1234}\" --no-interaction --env=prod 2>&1 | tail -20 || true; exec php -S 0.0.0.0:$PORT -t public public/router.php"
